# Your paying clients. Add one when they've paid (copy the example below, remove the # signs, fill it in).
# Photos they email you are saved and used automatically. You can also add photos yourself in
# clients/<their-name>/photos/ (for example clients/maple-street-coffee/photos/).

clients: []

# - name: "Maple Street Coffee"          # (an example, not a real business)
#   website: "https://www.example.com"
#   email: "owner@example.com"             # weekly posts go here; their replies approve posts or ask for designs
#   contact_name: "Sam"
#   niche: "cafe"                          # restaurant, cafe, bakery, gym, beauty, shop, bar, pets
#   city: "Columbus, OH"
#   plan: "bundle"                         # social (posts only), design (designs only) or bundle (both)
#   designs_per_month: 8                   # optional: a different design allowance for this client
