name: HQ

# Puts HQ (your dashboard) on Cloudflare whenever something in hq/ changes, or when you run it by hand from the
# Actions tab. Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as the studio agent; the token
# needs Workers Scripts: Edit and D1: Edit (see hq/README.md).
on:
  push:
    branches: [main]
    paths: ["hq/**", ".github/workflows/hq.yml"]
  workflow_dispatch:

concurrency:
  group: hq-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Deploy HQ
        working-directory: hq
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::HQ wasn't deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to this repository's secrets, then run the HQ workflow again."
            exit 0
          fi
          node deploy.mjs
