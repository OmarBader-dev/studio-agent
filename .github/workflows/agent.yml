name: Studio agent

# Started by the agent-scheduler Cloudflare Worker (it presses "Run workflow"), or by you from the Actions tab.
# Suggested times (add them to the Worker's JOBS list, see the README): daily at 14:37 UTC on weekdays, and the
# inbox (your Telegram commands, replies, client requests) at 06:37, 10:37 and 19:37 UTC.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        default: daily
        options: [daily, inbox, contacts, sample, kit, design, week, trends, status, test-email, telegram-id]
      target:
        description: "For sample/kit: a website. For design/week: the client's name. For trends: a city."
        type: string
        default: ""
      request:
        description: "For design only: what the design is for"
        type: string
        default: ""

concurrency:
  group: studio-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The newest commit when the run starts, not when it was queued: a run that waited for another one to
      # finish starts from the memory that one just saved (otherwise saving its own memory fails).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Find the agent's files
        run: |
          main=$(find . -path ./.git -prune -o -path '*/agent/__main__.py' -print | sort | head -n 1)
          if [ -z "$main" ]; then
            echo "::error::Can't find agent/__main__.py. Upload the agent's files to this repository."
            exit 1
          fi
          echo "APP=$(dirname "$(dirname "$main")")" >> "$GITHUB_ENV"

      # A public repository must keep the agent's memory encrypted: without STATE_KEY nothing runs or is saved.
      - name: Check the memory key (public repository)
        if: github.event.repository.visibility == 'public'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -z "$STATE_KEY" ]; then
            echo "::error::This repository is public, so the agent's memory must be encrypted. Add the STATE_KEY secret first (README, Minutes)."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - run: pip install -r "$APP/requirements.txt"

      - name: Video tool for Reels (ffmpeg, if this machine doesn't have it)
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # Font lists, design trends and client brand kits, kept between runs to save time.
      - uses: actions/cache@v4
        with:
          path: ${{ env.APP }}/data/cache
          key: studio-cache-${{ github.run_id }}
          restore-keys: studio-cache-

      - name: Run the agent
        env:
          STUDIO_BROWSER_CHANNEL: chrome          # GitHub's machines already have Chrome; nothing to download
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          HQ_URL: ${{ secrets.HQ_URL }}               # your HQ dashboard (optional), from HQ → Settings
          HQ_TOKEN: ${{ secrets.HQ_TOKEN }}
          CMD: ${{ inputs.command }}
          TARGET: ${{ inputs.target }}
          REQUEST: ${{ inputs.request }}
        run: |
          cd "$APP"
          if [ "$CMD" = "design" ]; then python -m agent design "$TARGET" "$REQUEST"
          else python -m agent "${CMD:-daily}" $TARGET; fi

      - name: Save the agent's memory
        if: always() && env.APP != ''
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          cd "$APP"
          git config user.name "studio-agent"
          git config user.email "studio-agent@users.noreply.github.com"
          if [ -n "$STATE_KEY" ]; then
            # Public repository: only the encrypted state is saved.
            git add data/state.enc 2>/dev/null || true
          elif [ "$VISIBILITY" = "public" ]; then
            echo "::error::Public repository without STATE_KEY: nothing saved, so nothing private is published."
            exit 1
          else
            for path in data/state.json data/outbox clients; do
              if [ -e "$path" ]; then git add "$path"; fi
            done
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Agent state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
